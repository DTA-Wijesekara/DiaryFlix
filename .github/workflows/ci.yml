name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: diaryflix_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: diaryflix_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U diaryflix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Run tests
        run: npm test

      - name: PostgreSQL integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://diaryflix_test:test_only@127.0.0.1:5432/diaryflix_ci_test

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm run test:e2e
